checkoutSCM:
  scm: git
  url: ${MUEN_COMMON_URL:-https://git.codelabs.ch/muen/common.git}
  branch: ${MUEN_COMMON_BRANCH:-rh-update}
  commit: ${MUEN_COMMON_COMMIT:-7ee2f5e922f0c0f43e713a7f2b98408a44b0f3a2}

multiPackage:
  gpr:
    buildScript: |
      rsync -a --delete $1/gpr .
    packageScript: |
      cp $1/gpr/* .
      echo "GPR_PROJECT_PATH=." >> .gpr_project

  "":
    inherit: [muen_component]
    buildVars: [ARCH, MUEN_BUILD_MODE]
    multiPackage:
      debug:
        depends:
          - muen::common-common-dev
          - muen::common-strings-dev
          - muen::common-crash_audit-dev
        buildVars: [MUEN_COMMON_VARIANT]
        buildScript: |
          muenBuild $1/debug/common_debug
        multiPackage: &common_dev_tgt_provides
          dev:
            provideDeps: ['*-dev']
            packageScript: muenInstallPackageDev
          tgt:
            provideDeps: ['*-tgt']
            packageScript: muenInstallPackageTgt
      crash_audit:
        depends:
          - muen::common-common-dev
        privateEnvironment:
          GPR_PATH: "crash_audit/crash_audit"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage:
          "":
            buildScript: muenBuild $1/${GPR_PATH}
            multiPackage: *common_dev_tgt_provides
          proof: &common_proof
            inherit: [muen_proof]
            buildSetup: |
              export GPR_FILE=$1/${GPR_PATH}
              export MUEN_BUILD_MODE=prove
              export OBJ_DIR=$(pwd)/obj/
              export LIB_DIR=$(pwd)/lib/
            buildScript: |
              muenProof
      common:
        privateEnvironment:
          GPR_PATH: "src/muen_common"
        buildVars: [ARCH, GPR_PATH, MUEN_COMMON_VARIANT]
        multiPackage:
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage: &common_dev_tgt
              dev:
                packageScript: muenInstallPackageDev
              tgt:
                packageScript: muenInstallPackageTgt
          proof: *common_proof
      strings:
        depends:
          - muen::common-common-dev
        privateEnvironment:
          GPR_PATH: "strings/common_strings"
        buildVars: [GPR_PATH, MUEN_COMMON_VARIANT]
        multiPackage:
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage: *common_dev_tgt_provides
          proof: *common_proof

      muinterrupts:
        buildVars: [MUEN_COMMON_VARIANT]
        buildScript: |
          muenBuild $1/muinterrupts/muinterrupts
        multiPackage: *common_dev_tgt

      musinfo:
        buildVars: [MUEN_COMMON_VARIANT]
        buildScript: |
          muenBuild $1/musinfo/musinfo
        multiPackage: *common_dev_tgt

      muschedinfo:
        buildVars: [MUEN_COMMON_VARIANT]
        buildScript: |
          muenBuild $1/muschedinfo/muschedinfo
        multiPackage: *common_dev_tgt

      mutimedevents:
        privateEnvironment:
          GPR_PATH: "mutimedevents/mutimedevents"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage:
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage: *common_dev_tgt
          proof: *common_proof
