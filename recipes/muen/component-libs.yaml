inherit: [muen_component]

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/component/libs.git
  branch: rh-upstream
  commit: 1aa4850259ea6e28762abd83534aedffb347f0f0

multiPackage:
  muinitstub:
    depends:
      - libs::libsparkcrypto-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmuinit-dev
      - use: []
        depends:
          - muen::component-libs-libmuinit-tgt
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/muinit/muinit
          cp $1/muinit/spec/muinit.xml .
        provideDeps: ['*-tgt']
        packageVars: [OBJCOPY]
        packageScript: |
          ${OBJCOPY} -O binary \
            --set-section-flags .bss=alloc,load,contents \
            --set-section-flags .stack=alloc,load,contents \
            $1/install/usr/bin/muinit muinit
          mkdir -p .bob/cspecs/
          cp $1/muinit.xml .bob/cspecs
      proof:
        inherit: [muen_proof_app]
        environment:
          RTS: "muen::rts"
          COMPONENT_NAME: "muinit"
          GPR_PATH: "muinit/muinit"
          GNATPROVE_FILES: "muinit_main.adb"

  libmuchannel:
    privateEnvironment:
      GPR_PATH: "libmuchannel/libmuchannel"
    buildVars: [ARCH, GPR_PATH]
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage: &common_dev_tgt
          dev:
            packageScript: |
              muenInstallPackageDev
          tgt:
            packageVars: [CSPECS_FILE]
            packageScript: |
              muenInstallPackageTgt
      proof: &common_proof_lib
        inherit: [muen_proof]
        buildSetup: |
          export GPR_FILE=$1/${GPR_PATH}
          export MUEN_BUILD_MODE=prove
          export OBJ_DIR=$(pwd)/obj/
          export LIB_DIR=$(pwd)/lib/
        buildScript: |
          muenProof

  libmucontroltypes:
    buildVars: [ARCH]
    buildScript: |
      muenBuild $1/libmucontroltypes/libmucontroltypes
    multiPackage: *common_dev_tgt

  libmucontrol:
    inherit: [muen_component_cspecs]
    depends:
      - muen::common-common-dev
      - muen::component-libs-libmucontroltypes-dev
    privateEnvironment:
      CSPECS_FILE: "generated/libmucontrol.xml"
      GPR_PATH: "libmucontrol/libmucontrol"
    buildVars: [ARCH, GPR_PATH]
    buildScript: |
      muenCspecs libmucontrol
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage: &common_dev_tgt_provide
          dev:
            provideDeps: ['*-dev']
            packageScript: |
              muenInstallPackageDev
          tgt:
            packageVars: [CSPECS_FILE]
            packageScript: |
              muenInstallPackageTgt
      proof: *common_proof_lib

  libmudebuglog:
    depends:
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmuchannel-dev
      - muen::build-cfg-scripts
      - ${MUEN_POLICY_SRC}

    privateEnvironment:
      CSPECS_FILE: "generated/libmudebuglog.xml"
      GPR_PATH: "libmudebuglog/libmudebuglog"

    Config:
      LIBMUDEBUGLOG_DISABLED:
        help: If set the library becomes a dummy.
        type: bool
        default: false

    buildTools: [mucgenspec, mucfgcvresalloc, muxmlfilter, libxslt-tools]
    buildVars: [ARCH, MUEN_POLICY_SRC, GPR_PATH, LIBMUDEBUGLOG_DISABLED]
    buildSetup: |
      BOOL=(false true)
      export LIBMUDEBUGLOG_GENERATED=$(pwd)/generated
      INPUT_SPEC=$1/libmudebuglog/spec/libmudebuglog.xml
      if [ ${LIBMUDEBUGLOG_DISABLED} -eq "1" ]; then
        INPUT_SPEC=$1/libmudebuglog/spec/libmudebuglog_null.xml
      fi
      export LIBMUDEBUGLOG_DISABLED=${BOOL[$LIBMUDEBUGLOG_DISABLED]}
    buildScript: |
      mkdir -p generated

      xsltproc -o generated/config.xml \
        --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
        $1/libmudebuglog/misc/config.xsl \
        ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

      mucfgcvresalloc $INPUT_SPEC \
                      generated/libmudebuglog.xml \
                      -I generated

      muxmlfilter -isn Component_Ext -osn Component generated/libmudebuglog.xml \
                  generated/libmudebuglog_filtered.xml
      mucgenspec --input-spec generated/libmudebuglog_filtered.xml \
                $(pwd)/generated
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage: *common_dev_tgt_provide
      proof: *common_proof_lib

  libmudm:
    inherit: [muen_component_cspecs]
    privateEnvironment:
      CSPECS_FILE: "generated/libmudm.xml"
      GPR_PATH: "libmudm/libmudm"
    depends:
      - muen::component-libs-libmusinfo-dev
    buildVars: [GPR_PATH]
    buildScript: |
      muenCspecs libmudm
    multiPackage:
      "":
        buildScript: |
          muenBuild  $1/${GPR_PATH}
        multiPackage: *common_dev_tgt
      proof: *common_proof_lib

  libmuinit:
    inherit: [muen_component_cspecs]
    depends:
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmucontrol-dev
      - muen::component-libs-libmupci-dev
      - libs::libsparkcrypto-dev
      - use: []
        depends:
          - muen::component-libs-libmucontrol-tgt
    privateEnvironment:
      CSPECS_FILE: "generated/libmuinit.xml"
      GPR_PATH: "libmuinit/libmuinit"
    buildVars: [GPR_PATH]
    buildScript: |
      muenCspecs libmuinit
    multiPackage:
      "":
        buildScript: |
          muenBuild  $1/${GPR_PATH}
        multiPackage: *common_dev_tgt_provide
      proof: *common_proof_lib

  libmublock:
    depends:
      - muen::common-strings-dev
      - muen::component-libmubase-dev
      - muen::component-libs-libmuchannel-dev
      - muen::component-libs-libmudebuglog-dev
    privateEnvironment:
      GPR_PATH: "libmublock/libmublock"
    buildVars: [GPR_PATH]
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage: *common_dev_tgt_provide
      proof: *common_proof_lib

  libmucoll:
    depends:
      - muen::component-libmubase-dev
      - muen::component-libs-libmuchannel-dev
      - muen::component-libs-libmusinfo-dev
    privateEnvironment:
      GPR_PATH: "libmucoll/libmucoll"
    buildVars: [ARCH, GPR_PATH]
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage: *common_dev_tgt_provide
      proof: *common_proof_lib

  libmupci:
    depends:
      - muen::common-strings-dev
      - muen::component-libmubase-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmudebuglog-dev
    privateEnvironment:
      GPR_PATH: "libmupci/libmupci"
    buildVars: [GPR_PATH]
    multiPackage:
      "":
        buildScript: muenBuild $1/${GPR_PATH}
        multiPackage: *common_dev_tgt_provide
      proof: *common_proof_lib

  libmutime:
    privateEnvironment:
      CSPECS_FILE: "generated/libmutime.xml"
      GPR_PATH: "libmutime/libmutime"
    buildVars: [ARCH, GPR_PATH]
    buildSetup: |
      export LIBMUTIME_GENERATED=$(pwd)/generated
    buildTools: [mucgenspec]
    buildScript: |
      mkdir -p generated
      cp $1/libmutime/spec/libmutime.xml generated
      mucgenspec --input-spec $1/libmutime/spec/libmutime.xml \
                $(pwd)/generated
    multiPackage:
      "":
        buildScript: muenBuild $1/${GPR_PATH}
        multiPackage: *common_dev_tgt
      proof:
        <<: *common_proof_lib
        privateEnvironment:
          GNATPROVE_STEPS: "200000"
          GNATPROVE_TIMEOUT: "0"
      test:
        inherit: [muen_test]
        privateEnvironment:
          TEST_NAME: "libmutime"
        buildVars: [TEST_NAME]
        buildSetup: |
          export GNATTEST_TESTS_DIR=$1/${TEST_NAME}/tests
        buildScript: |
          GNATTEST_DATA_DIR=$1/${TEST_NAME}
          muenTest $1/${TEST_NAME}/gnattest_${TEST_NAME}
        packageScript: |
          muenPackageTest
        multiPackage:
          arm64:
            buildSetup: |
              export TEST_SRC=arm64
          x86_64:
            buildSetup: |
              export TEST_SRC=x86_64

  libmusinfo:
    depends:
      - muen::common-musinfo-dev
      - muen::common-muschedinfo-dev
      - use: []
        depends:
          - muen::common-musinfo-tgt
          - muen::common-muschedinfo-tgt
    privateEnvironment:
      GPR_PATH: "libmusinfo/libmusinfo"
    buildVars: [ARCH, GPR_PATH]
    multiPackage:
      "":
        buildScript: |
          muenBuild $1/${GPR_PATH}
        multiPackage:
          dev:
            provideDeps: ['*-dev']
            packageScript: muenInstallPackageDev
          tgt:
            provideDeps: ['*-tgt']
            packageScript: muenInstallPackageTgt
      proof:
        inherit: [muen_proof]
        buildSetup: |
          export GPR_FILE=$1/${GPR_PATH}
          export MUEN_BUILD_MODE=prove
          export OBJ_DIR=$(pwd)/obj/
          export LIB_DIR=$(pwd)/lib/
        buildScript: |
          muenProof
      test:
        inherit: [muen_test]
        privateEnvironment:
          TEST_NAME: "libmusinfo"
        buildVars: [TEST_NAME]
        buildSetup: |
          export GNATTEST_TESTS_DIR=$1/${TEST_NAME}/tests
        buildScript: |
          GNATTEST_DATA_DIR=$1/${TEST_NAME}
          muenTest $1/${TEST_NAME}/gnattest_${TEST_NAME}
        packageScript: |
          muenPackageTest

  tests:
    inherit: [muen_tests]
    depends:
      - muen::component-libs-libmusinfo-test
      - muen::component-libs-libmutime-test-arm64
      - muen::component-libs-libmutime-test-x86_64
