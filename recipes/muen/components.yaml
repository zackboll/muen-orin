inherit: [muen_component]

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/components.git
  branch: main
  commit: 2f417fbecc9d5cbfd56653be9a6386a57973b6bf

environment:
  MUEN_COMMON_VARIANT: "component"
buildVars: [MUEN_BUILD_MODE]
depends:
  - name: muen::common-common-dev
multiPackage:
  storage_drv:
    inherit: [muen_component_app]
    depends:
      - muen::component-libs-libmublock-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmupci-dev
      - muen::common-strings-dev
      - use: []
        depends:
          - muen::component-libs-libmudebuglog-tgt
    buildVars: [DRIVE_KIND]
    buildSetup: |
      export BASE_DIR=${MUEN_STORAGE_BASE_DIR:-$(pwd)/src}
      if [ $DRIVE_KIND = NVME ]
      then
        IS_NVME_VARIANT="true"
      else
        IS_NVME_VARIANT="false"
      fi
      export MUEN_STORAGE_DRV_CSPECS=$(pwd)/generated
      export MUEN_STORAGE_DRV_PORTS_CFG=$(pwd)/generated

      sed -e "s/%%%IS_NVME_VARIANT%%%/${IS_NVME_VARIANT}/g" \
          -e "s/%%%COMPONENT_NAME%%%/storage_drv_${DRIVE_KIND,,}/g" \
          $1/storage_drv/spec/storage_drv.xml > storage_drv.xml
    buildScript: |
      buildApp () {
        muenBuildApp -n storage_drv-${DRIVE_KIND,,} \
                     -s $(pwd)/storage_drv.xml \
                     storage_drv
      }
    packageScript: |
      packageApp () {
        muenInstallApp
      }
    multiPackage:
      ahci:
        environment:
          DRIVE_KIND: "AHCI"
        multiPackage:
          "":
            buildScript: buildApp
            packageScript: packageApp
            provideDeps: ['*-tgt']
          proof: &storage_drv_proof
            inherit: [muen_proof_app]
            buildSetup: |
              export XML_CSPECS_PATH=$(pwd)/storage_drv.xml
            environment:
              RTS: "muen::rts"
              COMPONENT_NAME: "storage_drv"
              GPR_PATH: "storage_drv/storage_drv"
      nvme:
        environment:
          DRIVE_KIND: "NVME"
        multiPackage:
          "":
            buildScript: buildApp
            packageScript: packageApp
            provideDeps: ['*-tgt']
          proof: *storage_drv_proof
  controller:
    depends:
      - muen::component-libmubase-dev
      - muen::component-libs-libmucontroltypes-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::common-muinterrupts-dev
      - muen::common-strings-dev
      - use: []
        depends:
          - muen::component-libs-libmucontrol-tgt
          - muen::component-libs-libmudebuglog-tgt
    multiPackage:
      "":
        inherit: [muen_component_app]
        buildScript: |
          muenBuildApp controller
        packageScript: |
          muenInstallApp
        provideDeps: ['*-tgt']
      proof:
        inherit: [muen_proof_app]
        environment:
          RTS: "muen::rts"
          COMPONENT_NAME: "controller"
          GPR_PATH: "controller/controller"

  dbgserver:
    multiPackage:
      config-dev:
        depends:
          - muen::build-cfg-scripts
          - ${MUEN_POLICY_SRC}
        buildVars: [MUEN_POLICY_SRC]
        buildTools: [libxslt-tools]
        buildScript: |
          mkdir -p install/usr/share
          xsltproc -o install/usr/share/dbg_config.gpr \
                  --stringparam GPRNAME dbg_config \
                  --stringparam COMPONENTNAME dbgserver \
                  --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
                  $1/dbgserver/misc/gpr.xsl \
                  ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
        packageScript: |
          muenInstallPackageDev
      "":
        inherit: [python3]
        depends:
          - muen::component-libmubase-dev
          - muen::components-dbgserver-config-dev
          - muen::component-libs-libmucoll-dev
          - muen::component-libs-libmudebuglog-dev
          - muen::common-debug-dev
          - muen::common-crash_audit-dev
          - muen::common-strings-dev
          - ${MUEN_POLICY_SRC}
          - muen::build-cfg-scripts
          - if: "$(eq,${ARCH:-},x86_64)"
            name: libs::libxhcidbg-dev

          - name: python::lxml
            tools:
              target-toolchain: host-compat-toolchain
          - use: []
            depends:
              - muen::component-libs-libmudebuglog-tgt
              - if: "$(eq,${ARCH:-},x86_64)"
                name: libs::libxhcidbg-tgt
        buildVars: [ARCH, MUEN_POLICY_SRC]
        buildTools: [libxslt-tools]
        buildScript: |
          rm -rf generated && mkdir -p generated
          # generate dbg-subject_list.ads
          $1/dbgserver/misc/extract-subject-names.py \
            --out generated/dbg-subject_list.ads \
            --src_policy ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

          # generate logchannels.xml
          xsltproc -o generated/logchannels.xml \
                   --stringparam COMPONENTNAME dbgserver \
                   $1/dbgserver/misc/logchannels.xsl \
                   ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

          # generate logreaderstates.xml
          xsltproc -o generated/logreaderstates.xml \
                   --stringparam COMPONENTNAME dbgserver \
                   $1/dbgserver/misc/logreaderstates.xsl \
                   ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

          # generate subject_consoles.xml
          xsltproc -o generated/subject_consoles.xml \
                   --stringparam COMPONENTNAME dbgserver \
                   $1/dbgserver/misc/subject_consoles.xsl \
                   ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

          # generate config.xml
          xsltproc -o generated/config.xml \
                   --stringparam COMPONENTNAME dbgserver \
                   --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
                   $1/dbgserver/misc/config.xsl \
                   ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
        multiPackage:
          "":
            inherit: [muen_component_app]
            buildScript: |
              muenBuildApp dbgserver
            packageScript: |
              muenInstallApp
            provideDeps: ['*-tgt']
          proof:
            inherit: [muen_proof_app]
            environment:
              RTS: "muen::rts"
              COMPONENT_NAME: "dbgserver"
              GPR_PATH: "dbgserver/dbgserver_${ARCH}"

  dm:
    depends:
      - muen::component-libmubase-dev
      - muen::component-libs-libmudm-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::common-strings-dev
      - use: []
        depends:
          - muen::component-libs-libmudm-tgt
          - muen::component-libs-libmudebuglog-tgt
    multiPackage:
      "":
        inherit: [muen_component_app]
        buildScript: |
          muenBuildApp dm
        packageScript: |
          muenInstallApp
        provideDeps: ['*-tgt']
      proof:
        inherit: [muen_proof_app]
        environment:
          RTS: "muen::rts"
          COMPONENT_NAME: "dm"
          GPR_PATH: "dm/dm"

  example:
    depends:
      - ${MUEN_POLICY_SRC}
    buildVars: [MUEN_POLICY_SRC]
    multiPackage:
      config-dev:
        depends:
          - muen::build-cfg-scripts
        buildTools: [libxslt-tools]
        buildScript: |
          mkdir -p install/usr/share
          xsltproc -o install/usr/share/example_config.gpr \
                  --stringparam GPRNAME example_config \
                  --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
                  $1/example/misc/gpr.xsl \
                  ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
        packageScript: |
          muenInstallPackageDev

      "":
        depends:
          - muen::components-example-config-dev
          - muen::component-libs-libmublock-dev
          - muen::component-libs-libmucoll-dev
          - muen::component-libs-libmucontrol-dev
          - muen::component-libs-libmudebuglog-dev
          - muen::common-crash_audit-dev
          - muen::common-debug-dev
          - muen::common-mutimedevents-dev
          - muen::common-strings-dev
          - muen::component-libmubase-dev
          - use: []
            depends:
              - muen::component-libs-libmucontrol-tgt
              - muen::component-libs-libmudebuglog-tgt
        multiPackage:
          "":
            inherit: [muen_component_app]
            buildScript: |
              muenBuildApp example
            packageScript: |
              muenInstallApp
            provideDeps: ['*-tgt']
          proof:
            inherit: [muen_proof_app]
            environment:
              RTS: "muen::rts"
              COMPONENT_NAME: "example"
              GPR_PATH: "example/example"

  idle:
    depends:
      - muen::component-libmubase-dev
    inherit: [muen_component_app]
    buildScript: |
      muenBuildApp idle
    packageScript: |
      muenInstallApp

  isolation_tests:
    inherit: [muen_component_app, python3]
    depends:
      - ${MUEN_POLICY_SRC}
      - muen::common-strings-dev
      - muen::component-libmubase-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::tools-libmupy
      - use: []
        depends:
          - muen::component-libs-libmudebuglog-tgt
      - name: python::lxml
        tools:
          target-toolchain: host-compat-toolchain
    buildVars: [MUEN_POLICY_SRC]
    buildScript: |
      # Generate reference_values.ads
      $1/isolation_tests/misc/reference_values.py \
        --out generated/reference_values.ads \
        --src_policy ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
      muenBuildApp isolation_tests
    packageScript: |
      muenInstallApp
    provideDeps: ['*-tgt']

  isolation_tests_monitor:
    inherit: [muen_component_app]
    depends:
      - ${MUEN_POLICY_SRC}
      - muen::common-strings-dev
      - muen::component-libmubase-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmudebuglog-dev
      - use: []
        depends:
          - muen::component-libs-libmudebuglog-tgt
    privateEnvironment:
      INSTALL_APPLY_SHEBANG_FIXUP: "no"
    buildVars: [MUEN_POLICY_SRC]
    buildScript: |
      muenBuildApp isolation_tests_monitor
    packageScript: |
      muenInstallApp
    provideDeps: ['*-tgt']

  ps2_drv:
    inherit: [muen_component_app]
    depends:
      - muen::component-libmubase-dev
      - muen::common-strings-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmudebuglog-dev
      - use: []
        depends:
          - muen::component-libs-libmudebuglog-tgt
    buildScript: |
      muenBuildApp ps2_drv
    packageScript: |
      muenInstallApp
    provideDeps: ['*-tgt']

  sl:
    depends:
      - muen::component-libmubase-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmuinit-dev
      - name: python::lxml
        tools:
          target-toolchain: host-compat-toolchain
      - use: []
        depends:
          - muen::component-libs-libmuinit-tgt
    multiPackage:
      "":
        inherit: [muen_component_app, python3]
        buildScript: |
          muenBuildApp sl
          mv install/.bob/cspecs/sl.xml sl_split.xml
          $1/sl/misc/adjust-xml-spec.py sl_split.xml \
            install/.bob/cspecs/sl.xml
        packageScript: |
          muenInstallApp
      proof:
        inherit: [muen_proof_app]
        environment:
          RTS: "muen::rts"
          COMPONENT_NAME: "sl"
          GPR_PATH: "sl/sl"

  sm:
    depends:
      - ${MUEN_POLICY_SRC}
    multiPackage:
      config-dev:
        depends:
          - muen::build-cfg-scripts
        buildVars: [MUEN_POLICY_SRC]
        buildTools: [libxslt-tools]
        buildScript: |
          mkdir -p install/usr/share
          xsltproc -o install/usr/share/config.gpr \
                  --stringparam GPRNAME config \
                  --stringparam COMPONENTNAME config \
                  --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
                  $1/sm/misc/gpr.xsl \
                  ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
        packageScript: |
          muenInstallPackageDev
      "":
        inherit: [python3]
        depends:
          - muen::common-strings-dev
          - muen::component-libmubase-dev
          - muen::component-libs-libmucoll-dev
          - muen::component-libs-libmucontrol-dev
          - muen::component-libs-libmudebuglog-dev
          - muen::component-libs-libmudm-dev
          - muen::component-libs-libmutime-dev
          - muen::components-sm-config-dev
          - muen::build-cfg-scripts

          - name: python::lxml
            tools:
              target-toolchain: host-compat-toolchain
          - use: []
            depends:
              - muen::component-libs-libmucontrol-tgt
              - muen::component-libs-libmudebuglog-tgt
              - muen::component-libs-libmudm-tgt
              - muen::component-libs-libmutime-tgt
        buildTools: [libxslt-tools]
        buildVars: [MUEN_POLICY_SRC]
        buildScript: |
          rm -rf generated && mkdir -p generated
          # Generate cpu_values-target.ads
          $1/sm/misc/cpu-values.py \
            --out generated/cpu_values-target.ads \
            --src_policy ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml

          # generate config.xml
          xsltproc -o generated/config.xml \
                   --stringparam COMPONENTNAME sm \
                   --path ${BOB_DEP_PATHS[muen::build-cfg-scripts]}/ \
                   $1/sm/misc/config.xsl \
                   ${BOB_DEP_PATHS[${MUEN_POLICY_SRC}]}/policy_src.xml
        multiPackage:
          "":
            inherit: [muen_component_app]
            buildScript: |
              muenBuildApp sm
            packageScript: |
              muenInstallApp
            provideDeps: ['*-tgt']
          proof:
            inherit: [muen_proof_app]
            environment:
              RTS: "muen::rts"
              COMPONENT_NAME: "sm"
              GPR_PATH: "sm/sm"

  tau0:
    inherit: [muen_component_app]
    depends:
      - name: muen::x86-systems-policy
        use: [result]
      - muen::component-libmubase-dev
    buildSetup: |
      export POLICY_DIR=${BOB_DEP_PATHS[muen::x86-systems-policy]}
    buildScript: muenBuildApp tau0
    packageVars: [OBJCOPY]
    packageScript: |
      ${OBJCOPY} -O binary \
        --set-section-flags .bss=alloc,load,contents \
        --set-section-flags .stack=alloc,load,contents \
        $1/install/usr/bin/tau0 tau0

  time:
    inherit: [muen_component_app]
    depends:
      - muen::component-libmubase-dev
      - muen::common-strings-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::component-libs-libmucontrol-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmutime-dev
      - use: []
        depends:
          - muen::component-libs-libmucontrol-tgt
          - muen::component-libs-libmudebuglog-tgt
          - muen::component-libs-libmutime-tgt
    multiPackage:
      "":
        buildVars: [ARCH]
        buildSetup: |
          sed -e "s/%%%ARCH%%%/${ARCH}/g" \
              $1/time/spec/time.xml > time.xml
        buildScript: |
          muenBuildApp -s time.xml time
        packageScript: |
          muenInstallApp
        provideDeps: ['*-tgt']
      proof:
        inherit: [muen_proof_app]
        environment:
          RTS: "muen::rts"
          COMPONENT_NAME: "time"
          GPR_PATH: "time/time"

  vt:
    inherit: [muen_component_app]
    depends:
      - muen::component-libmubase-dev
      - muen::common-debug-dev
      - muen::common-strings-dev
      - muen::component-libs-libmusinfo-dev
      - muen::component-libs-libmudebuglog-dev
      - muen::component-libs-libmutime-dev
      - muen::component-libs-libmucoll-dev
      - muen::component-libs-libmucontrol-dev
      - use: []
        depends:
          - muen::component-libs-libmucontrol-tgt
          - muen::component-libs-libmudebuglog-tgt
          - muen::component-libs-libmutime-tgt
    buildScript: |
      muenBuildApp vt
    packageScript: |
      muenInstallApp
    provideDeps: ['*-tgt']
